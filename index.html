<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.avs button.on{border-color:#ffd60a;background:rgba(255,214,10,.25);transform:scale(1.08)}
.big{font-family:'Lilita One';font-size:26px;padding:15px 18px;border-radius:18px;border:3px solid #000;box-shadow:0 6px 0 #000;cursor:pointer;color:#1b0b3a;width:100%;transition:transform .05s}

.b1{background:#ffd60a}.b2{background:#2fe0ff}.b3{background:#ff2d87;color:#fff}

.joinrow{display:flex;gap:8px}.joinrow input{flex:1;letter-spacing:6px;text-transform:uppercase}.joinrow .big{width:auto}

.mash{flex:1;display:flex;align-items:center;justify-content:center;touch-action:none}
.mashb{width:min(72vw,290px);aspect-ratio:1;border-radius:50%;border:6px solid #000;box-shadow:0 12px 0 #000;background:radial-gradient(circle at 35% 30%,#ff7a96,#e5133d 60%);
  font-family:'Lilita One';color:#fff;font-size:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-shadow:0 4px 0 #000;touch-action:none}

.rbtn{flex:1;border-radius:26px;border:4px solid #000;box-shadow:0 8px 0 #000;font-family:'Lilita One';font-size:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;touch-action:none;line-height:1.05;padding:10px}

.r-wait{background:#e5243b}.r-go{background:#21d07a;color:#06301b}.r-fake{background:#ff9f1c;color:#3b1d00}.r-bad{background:#555}.r-ok{background:#3d8bff}

@keyframes shake{0%{transform:rotate(-2deg)}50%{transform:rotate(2deg) scale(1.01)}100%{transform:rotate(-2deg)}}
.bombview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;font-weight:900;font-size:22px}

@keyframes wob{50%{transform:scale(1.15) rotate(8deg)}}
.boom{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:26px;background:#ffd60a;color:#1b0b3a;animation:flash .25s 6 alternate;font-family:'Lilita One';font-size:64px;border:4px solid #000}
.boom small{font-size:26px}
@keyframes flash{from{background:#fff}to{background:#ff3b00;color:#fff}}
.holder{border-color:#ff2d55!important;background:#ff2d55!important}
.clock{font-family:'Lilita One';font-size:96px;text-align:center;font-variant-numeric:tabular-nums;text-shadow:0 6px 0 #000;margin:20px 0}
.huge{font-size:40px;padding:30px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;font-size:clamp(28px,9vw,44px);text-align:center;background:rgba(0,0,0,.25);border-radius:18px;padding:8px;line-height:1.25}
.num{font-family:'Lilita One';font-size:110px;text-align:center;text-shadow:0 6px 0 #000;line-height:1}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.steps button{font-family:'Lilita One';font-size:28px;padding:16px 0;border-radius:16px;border:3px solid #000;box-shadow:0 5px 0 #000;background:#2fe0ff;color:#1b0b3a}
.steps button:active{transform:translateY(3px);box-shadow:0 2px 0 #000}
.sword{font-family:'Lilita One';font-size:clamp(48px,16vw,76px);text-align:center;-webkit-text-stroke:2px #000;text-shadow:0 6px 0 #000;margin:18px 0 8px;animation:pop .25s}

.sbtn{font-family:'Lilita One';font-size:26px;border-radius:18px;border:3px solid #000;box-shadow:0 6px 0 #000;background:#24123f;touch-action:none}

.sbtn.ok{background:#21d07a!important;color:#000!important}.sbtn.bad{background:#ff3b3b!important;color:#fff!important}
.rtitle{font-family:'Lilita One';font-size:34px;text-align:center;color:#ffd60a;text-shadow:0 4px 0 #000}

.rrow{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);border-radius:16px;padding:8px 12px;border-left:7px solid var(--c);font-weight:900;animation:slide .4s backwards}
.rrow .medal{font-size:28px}.rrow .av{font-size:28px}.rrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .val{opacity:.85;font-size:14px}.rrow .pts{font-family:'Lilita One';font-size:22px;color:#ffd60a;min-width:38px;text-align:right}
@keyframes slide{from{transform:translateX(-40px);opacity:0}}
.roast{text-align:center;font-weight:900;font-size:18px;background:#ff2d87;border:3px solid #000;border-radius:16px;padding:10px;transform:rotate(-1.5deg)}
.win{text-align:center;font-family:'Lilita One';font-size:24px;color:#2fe0ff}

.pod{flex:1;text-align:center;font-weight:900}
.pod .av{font-size:46px}.pod .blk{border:3px solid #000;border-radius:14px 14px 0 0;font-family:'Lilita One';font-size:34px;padding-top:6px;color:#1b0b3a}
.p1 .blk{height:130px;background:#ffd60a}.p2 .blk{height:95px;background:#d6dde8}.p3 .blk{height:70px;background:#e09a5a}
.title{font-size:13px;color:#ffd60a}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.confetti i{position:absolute;top:-20px;width:10px;height:16px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.flex1{flex:1}
.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:#000;padding:10px 16px;border-radius:12px;font-weight:900;z-index:9}

<body>
<div id="app"></div>
<script>
(function(){
'use strict';
const app = document.getElementById('app');
const AVS = ['🐸','🦊','🐷','🐵','🦄','🐔','🤡','👽','🐙','🦖'];
const COLS = ['#21d07a','#ff7a2f','#ff5cd6','#c08a5a','#b25cff','#ffd60a','#ff3d6e','#00e0d0','#2fb8ff','#7ddc1f'];
const colOf = av => COLS[Math.max(0, AVS.indexOf(av))];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clean = s => String(s || '').replace(/[\u0000-\u001f\u007f-\u009f­​‎‏‪-‮⁠-⁤﻿]/g, '').trim().slice(0, 12);
const pick = a => a[Math.floor(Math.random() * a.length)];
function rng(seed){ let a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffle(arr, r){ r = r || Math.random; for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }

// ---------- perfil ----------
let prof = { name: '', av: pick(AVS) };
try { const s = JSON.parse(localStorage.getItem('manotazo-prof') || 'null'); if (s && s.av) prof = { name: clean(s.name), av: AVS.includes(s.av) ? s.av : prof.av }; } catch(e){}
const saveProf = () => { try { localStorage.setItem('manotazo-prof', JSON.stringify(prof)); } catch(e){} };
let joinCode = '';
try { const h = (location.hash || '').slice(1); if (/^[A-Za-z]{4}$/.test(h)) joinCode = h.toUpperCase(); } catch(e){}
let homeVals = { nm: prof.name, cd: joinCode };
let homeErr = '';
let screen = 'home';
let joinedAt = 0;

// ---------- audio ----------
let AC = null;
function unlock(){ try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume(); } catch(e){} }
['touchend','click','pointerdown','keydown'].forEach(ev => document.addEventListener(ev, unlock, { passive: true }));
function tone(f, d, type, v, when, slide){ if (!AC) return; try { d = d || .12; const t = AC.currentTime + (when || 0); const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'square'; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d); g.gain.setValueAtTime(v || .08, t); g.gain.exponentialRampToValueAtTime(.0001, t + d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + d + .02); } catch(e){} }
function boomSnd(){ if (!AC) return; try { const len = AC.sampleRate * .9, b = AC.createBuffer(1, len, AC.sampleRate), ch = b.getChannelData(0); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5); const s = AC.createBufferSource(); s.buffer = b; const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 900; const g = AC.createGain(); g.gain.value = .9; s.connect(f).connect(g).connect(AC.destination); s.start(); tone(90, .6, 'sine', .5, 0, 40); } catch(e){} }
const SFX = {
  tick: () => tone(660, .07), go: () => { tone(880, .1); tone(1320, .2, 'square', .08, .1); },
  tap: () => tone(280 + Math.random() * 260, .04, 'square', .035), buzz: () => tone(110, .45, 'sawtooth', .14),
  ok: () => tone(1046, .1, 'triangle', .14), bad: () => tone(150, .25, 'sawtooth', .1),
  pass: () => tone(450, .15, 'triangle', .12, 0, 1300), alarm: () => { tone(1250, .07); tone(1250, .07, 'square', .08, .11); tone(1250, .07, 'square', .08, .22); },
  win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, .16, 'triangle', .13, i * .11)),
  sad: () => [392, 370, 349, 311].forEach((f, i) => tone(f, .32, 'sawtooth', .07, i * .3)),
  boom: boomSnd
};
const vib = p => { try { navigator.vibrate && navigator.vibrate(p); } catch(e){} };

// ---------- red ----------
const Net = {
  mode: null, code: '', isHost: false, myId: null, mine: {}, others: {}, send: null, connected: true, timer: null, last: 0,
  all(){ const o = Object.assign({}, this.others); o[this.myId || 'me'] = this.mine; return o; },
  set(p){ Object.assign(this.mine, p); onNet(); this.flush(); },
  flush(){ if (this.timer) return; const wait = Math.max(0, 90 - (Date.now() - this.last)); this.timer = setTimeout(() => { this.timer = null; this.last = Date.now(); if (this.send) this.send(JSON.parse(JSON.stringify(this.mine))); }, wait); }
};

async function startRoom(code){
  const room = await window.claude.use('room');
  if (!room) throw new Error('noroom');
  let r = room;
  try { r = await room.join('mz-' + code.toLowerCase()); } catch(e){ r = room; }
  Net.send = s => { try { r.presence(s).catch(() => {}); } catch(e){} };
  r.onPeers(ch => {
    const st = {};
    for (const p of ch.peers){
      if (p.sameTab){ Net.myId = p.peer; continue; }
      if (p.kind !== 'viewer') continue;
      const pr = p.presence;
      if (!pr || !pr.name || pr.code !== code) continue;
      st[p.peer] = pr;
    }
    Net.others = st; onNet();
  }, () => { Net.connected = false; });
  try { r.onConnection(c => { Net.connected = c; }); } catch(e){}
}

function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function startPeer(code, isHost){
  if (!window.Peer) await loadScript('https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js');
  const hid = 'manotazo-v1-' + code;
  if (isHost){
    const peer = new window.Peer(hid);
    await new Promise((res, rej) => { peer.on('open', res); peer.on('error', rej); setTimeout(() => rej(new Error('timeout')), 10000); });
    Net.myId = hid;
    const conns = {};
    peer.on('connection', c => {
      conns[c.peer] = c;
      c.on('data', d => { if (d && d.s && typeof d.s === 'object'){ Net.others[c.peer] = d.s; onNet(); } });
      c.on('close', () => { delete conns[c.peer]; delete Net.others[c.peer]; onNet(); });
    });
    Net.send = () => {};
    setInterval(() => { const all = Net.all(); for (const id in conns){ const c = conns[id]; if (c.open) try { c.send({ all }); } catch(e){} } }, 100);
  } else {
    const peer = new window.Peer();
    await new Promise((res, rej) => { peer.on('open', res); peer.on('error', rej); setTimeout(() => rej(new Error('timeout')), 10000); });
    Net.myId = peer.id;
    const c = peer.connect(hid, { reliable: true });
    await new Promise((res, rej) => { c.on('open', res); peer.on('error', rej); setTimeout(() => rej(new Error('timeout')), 9000); });
    c.on('data', d => { if (d && d.all){ const o = Object.assign({}, d.all); delete o[Net.myId]; Net.others = o; onNet(); } });
    c.on('close', () => { Net.others = {}; Net.connected = false; onNet(); });
    Net.send = s => { if (c.open) try { c.send({ s }); } catch(e){} };
  }
}

function newCode(){ const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ'; let s = ''; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }

async function start(code, isHost){
  screen = 'connecting';
  Net.code = code; Net.isHost = isHost;
  Object.assign(Net.mine, { name: prof.name, av: prof.av, col: colOf(prof.av), code, j: Date.now(), host: isHost });
  try {
    if (window.claude && typeof window.claude.use === 'function'){ Net.mode = 'room'; await startRoom(code); }
    else {
      Net.mode = 'p2p';
      let tries = 0;
      for (;;){
        try { await startPeer(code, isHost); break; }
        catch(e){ if (isHost && e && e.type === 'unavailable-id' && tries++ < 3){ code = newCode(); Net.code = code; Net.mine.code = code; continue; } throw e; }
      }
    }
  } catch(e){
    homeErr = Net.mode === 'room' ? 'No pude conectarme al modo online 😵 Abrí el link con tu cuenta de Claude.' : (isHost ? 'No pude crear la sala. Probá de nuevo.' : 'No encontré esa sala 🤔 Revisá el código.');
    screen = 'home'; return;
  }
  if (isHost){ G = newGame(); setInterval(hostTick, 100); }
  try { history.replaceState(null, '', '#' + code); } catch(e){ try { location.hash = code; } catch(_){} }
  joinedAt = Date.now(); screen = 'game';
  Net.flush();
}

// ---------- jugadores ----------
const ME = () => Net.myId || 'me';
function players(){
  const all = Net.all(), arr = [];
  for (const id in all){
    const s = all[id];
    if (!s || !s.name || s.code !== Net.code) continue;
    const av = AVS.includes(s.av) ? s.av : '🙂';
    arr.push({ id, name: clean(s.name) || '???', av, col: colOf(av), host: !!s.host, j: +s.j || 0, s });
  }
  arr.sort((a, b) => (b.host - a.host) || (a.j - b.j) || (a.id < b.id ? -1 : 1));
  return arr;
}
const inOfS = (S, id, rid) => { const i = S[id] && S[id].in; return (i && i.rid === rid) ? i : {}; };

// ---------- minijuegos ----------
const SC = [{ n: 'ROJO', c: '#ff3b3b' }, { n: 'AZUL', c: '#3d8bff' }, { n: 'VERDE', c: '#21d07a' }, { n: 'AMARILLO', c: '#ffd60a' }];
function stroopQs(seed){
  const r = rng(seed), out = [];
  for (let q = 0; q < 15; q++){
    const w = Math.floor(r() * 4); let k = Math.floor(r() * 4);
    if (k === w && r() < .85) k = (k + 1 + Math.floor(r() * 3)) % 4;
    const order = shuffle([0, 1, 2, 3], r), tint = Math.floor(r() * 3) + 1;
    out.push({ w, k, order, tint });
  }
  return out;
}
function countGrid(seed){
  const r = rng(seed), N = 7 + Math.floor(r() * 10), dec = ['🐓','🐤','🐣','🦃','🐦','🦆','🥚','🐥'], cells = [];
  for (let i = 0; i < N; i++) cells.push('🐔');
  while (cells.length < 42) cells.push(dec[Math.floor(r() * dec.length)]);
  return { N, cells: shuffle(cells, r) };
}

const GAMES = {
  tap: { name: '¡MACHACA!', emoji: '👊', desc: 'Tocá el botón lo más rápido que puedas durante 12 segundos. Sin piedad con la pantalla.', dur: 12000,
    init(){}, rank(d, H, i){ const n = +i.n || 0; return { k: -n, v: n + ' toques' }; } },
  react: { name: '¡NO TE ADELANTES!', emoji: '🚦', desc: 'Cuando la pantalla se ponga VERDE, tocá. Si tocás antes, quedás de payaso.', cap: 12000,
    init(d, H, P, now){ d.go = 0; d.fake = 0; H.goAt = now + 2000 + Math.random() * 4500; if (Math.random() < .6) H.fakeAt = now + 800 + Math.random() * (H.goAt - now - 1600); },
    tick(d, H, P, S, now, rid){
      if (!d.go){ d.fake = (H.fakeAt && now >= H.fakeAt && now < H.fakeAt + 700) ? 1 : 0; if (now >= H.goAt){ d.go = 1; d.fake = 0; H.goT = now; } }
      if (P.every(id => { const i = inOfS(S, id, rid); return i.early || i.ms != null; })) return true;
      return !!(d.go && now - H.goT > 3000);
    },
    rank(d, H, i){ if (i.early) return { k: 2e6, v: '🤡 se adelantó' }; if (i.ms != null) return { k: Math.max(0, +i.ms), v: Math.max(0, +i.ms) + ' ms' }; return { k: 1e6, v: '😴 dormido' }; } },
  bomb: { name: 'BOMBA CALIENTE', emoji: '💣', desc: 'Si te llega la bomba, ¡PASALA! Al que le explote en la mano, pierde. Son 5 explosiones.', cap: 150000,
    init(d, H, P, now){ H.b = {}; H.seen = {}; d.left = 5; d.h = pick(P); d.x = null; d.pc = 0; d.b = []; H.fuse = now + 5000 + Math.random() * 7000; H.lp = now; },
    tick(d, H, P, S, now, rid){
      if (d.x){ if (now >= H.xu){ d.x = null; if (d.left <= 0) return true; d.h = pick(P); d.pc++; H.fuse = now + 4000 + Math.random() * 8000; H.lp = now; } return false; }
      if (!P.includes(d.h)) d.h = pick(P);
      for (const id of P){
        const pc = +inOfS(S, id, rid).pass || 0, prev = H.seen[id] || 0;
        if (id === d.h && pc > prev && now - H.lp > 350 && P.length > 1){ d.h = pick(P.filter(x => x !== id)); H.lp = now; d.pc++; }
        H.seen[id] = pc;
      }
      if (now >= H.fuse){ d.x = d.h; H.b[d.h] = (H.b[d.h] || 0) + 1; d.left--; H.xu = now + 2400; }
      d.b = Object.entries(H.b);
      return false;
    },
    rank(d, H, i, id){ const n = H.b[id] || 0; return { k: n, v: n ? '💥×' + n : 'intacto 😎' }; } },
  stop: { name: 'FRENÁ EN 10', emoji: '⏱️', desc: 'El reloj arranca en 0 y se esconde a los 3 segundos. Frenalo lo más cerca posible de 10.00.', cap: 17000,
    init(){}, tick(d, H, P, S, now, rid){ return P.every(id => inOfS(S, id, rid).ms != null); },
    rank(d, H, i){ if (i.ms == null) return { k: 1e9, v: 'no frenó 🫠' }; const ms = +i.ms; return { k: Math.abs(ms - 10000), v: (ms / 1000).toFixed(2) + 's' }; },
    reveal(){ return '🎯 Objetivo: 10.00s'; } },
  count: { name: '¿CUÁNTOS POLLOS?', emoji: '🐔', desc: 'Vas a ver un montón de bichos por 6 segundos. Contá SOLO los 🐔. Ojo con los impostores.', dur: 18000,
    init(d, H){ d.seed = (Math.random() * 1e9) | 0; d.show = 1; H.N = countGrid(d.seed).N; },
    tick(d, H, P, S, now, rid){ d.show = now - H.start < 6500 ? 1 : 0; return !d.show && P.every(id => inOfS(S, id, rid).g != null); },
    rank(d, H, i){ if (i.g == null) return { k: 1e12, v: 'ni respondió' }; const diff = Math.abs(+i.g - H.N); return { k: diff * 1e6 + Math.min(+i.at || 0, 999999), v: 'dijo ' + (+i.g) }; },
    reveal(d, H){ return 'Había ' + H.N + ' 🐔'; } },
  stroop: { name: 'COLOR TRAMPOSO', emoji: '🎨', desc: 'Tocá el COLOR de la tinta, NO lo que dice la palabra. 15 preguntas rapidísimas.', dur: 15 * 2000,
    init(d){ d.seed = (Math.random() * 1e9) | 0; d.q = 0; },
    tick(d, H, P, S, now){ d.q = Math.min(14, Math.floor((now - H.start) / 2000)); return false; },
    rank(d, H, i){ const Q = stroopQs(d.seed), a = i.a || {}; let sc = 0, t = 0; for (let q = 0; q < 15; q++){ const r = a['q' + q]; if (!r) continue; if (+r[0] === Q[q].k){ sc++; t += +r[1] || 0; } else sc--; } return { k: -sc * 1e6 + t, v: sc + ' pts' }; } }
};

// ---------- motor del anfitrión ----------
let G = null, H = {}, HS = {}, hEnd = 0;
function newGame(){ return { ph: 'lobby', rounds: 8, rid: 0, ri: 0, n: 0, list: [], sc: [], d: {}, t: 0, gk: null, res: null, rev: '' }; }
function makeList(n){ const keys = Object.keys(GAMES); let out = []; while (out.length < n){ const bag = shuffle(keys.slice()); if (out.length && bag[0] === out[out.length - 1]) bag.push(bag.shift()); out = out.concat(bag); } return out.slice(0, n); }
function hostStart(){ const P = players(); if (P.length < 2) return; HS = {}; P.forEach(p => HS[p.id] = 0); G.list = makeList(G.rounds); G.ri = 0; startIntro(); }
function startIntro(){ G.rid++; G.ph = 'intro'; G.gk = G.list[G.ri]; G.d = {}; G.res = null; G.rev = ''; H = {}; hEnd = Date.now() + 5000; }
function finishRound(P, S, now){
  const gm = GAMES[G.gk];
  const rows = P.map(id => Object.assign({ id }, gm.rank(G.d, H, inOfS(S, id, G.rid), id)));
  rows.sort((a, b) => a.k - b.k);
  const top = Math.min(3, rows.length - 1); let place = 0;
  rows.forEach((r, i) => { if (i > 0 && r.k !== rows[i - 1].k) place = i; r.pl = place; r.pts = Math.max(0, top - place); HS[r.id] = (HS[r.id] || 0) + r.pts; });
  G.res = rows.map(r => ({ id: r.id, v: r.v, pl: r.pl, pts: r.pts }));
  G.rev = gm.reveal ? gm.reveal(G.d, H) : '';
  G.ph = 'res'; hEnd = now + 6500;
}
function hostTick(){
  if (!G) return;
  const now = Date.now(), P = players().map(p => p.id), S = Net.all();
  if (G.ph !== 'lobby' && G.ph !== 'final') for (const id of P) if (!(id in HS)) HS[id] = 0;
  if (G.ph === 'intro'){ if (now >= hEnd){ const gm = GAMES[G.gk]; G.ph = 'play'; H = { start: now }; hEnd = now + (gm.dur || gm.cap); gm.init(G.d, H, P, now); } }
  else if (G.ph === 'play'){ const gm = GAMES[G.gk]; const done = gm.tick ? gm.tick(G.d, H, P, S, now, G.rid) : false; if (done || now >= hEnd) finishRound(P, S, now); }
  else if (G.ph === 'res'){ if (now >= hEnd){ G.ri++; if (G.ri >= G.list.length) G.ph = 'final'; else startIntro(); } }
  G.t = Math.max(0, hEnd - now); G.sc = Object.entries(HS); G.n = G.list.length;
  Net.set({ g: G });
}

// ---------- estado local del cliente ----------
function curG(){
  if (Net.isHost) return G;
  const h = players().find(p => p.host);
  const g = h && h.s.g;
  return (g && typeof g === 'object' && g.d && typeof g.d === 'object') ? g : null;
}
let L = { rid: -1 }, prev = { ph: null, rid: -1, sec: -1, pc: -1, x: null, q: -1 };
function myIn(){ const g = curG(); const i = Net.mine.in; return (g && i && i.rid === g.rid) ? i : { rid: g ? g.rid : -1 }; }
function setIn(p){ Net.set({ in: Object.assign({}, myIn(), p) }); }
function onNet(){
  const g = curG(); if (!g) return;
  const now = performance.now();
  if (g.rid !== L.rid) L = { rid: g.rid, n: 0, pass: 0, guess: 10 };
  if (g.ph === 'play' && !L.start) L.start = now;
  if (g.gk === 'react' && g.ph === 'play' && g.d.go && !L.go) L.go = now;
  if (g.gk === 'stroop' && g.ph === 'play' && g.d.q !== L.q){ L.q = g.d.q; L.qs = now; }
  if (g.gk === 'count' && g.ph === 'play' && !g.d.show && !L.as) L.as = now;
  // sonidos de transición
  const me = ME();
  if (g.ph !== prev.ph || g.rid !== prev.rid){
    if (g.ph === 'play') SFX.go();
    if (g.ph === 'res' && g.res){ const r = g.res.find(x => x.id === me); if (r && r.pl === 0) SFX.win(); else if (r && r.pl === g.res[g.res.length - 1].pl && g.res.length > 1) SFX.sad(); else SFX.ok(); }
    if (g.ph === 'final') SFX.win();
    prev.ph = g.ph; prev.rid = g.rid; prev.pc = -1; prev.x = null;
  }
  if (g.ph === 'intro'){ const s = Math.ceil(g.t / 1000); if (s !== prev.sec && s <= 3 && s > 0) SFX.tick(); prev.sec = s; }
  if (g.gk === 'bomb' && g.ph === 'play'){
    if (g.d.pc !== prev.pc){ if (prev.pc !== -1) SFX.pass(); if (g.d.h === me && !g.d.x){ SFX.alarm(); vib(120); } prev.pc = g.d.pc; }
    if (g.d.x && g.d.x !== prev.x){ SFX.boom(); vib([300, 80, 300]); }
    prev.x = g.d.x || null;
  }
}

// ---------- acciones ----------
function act(a, v){
  const g = curG(), me = ME();
  switch (a){
    case 'av': prof.av = v; saveProf(); homeVals = { nm: prof.name, cd: joinCode }; break;
    case 'create': case 'join': {
      prof.name = clean(prof.name);
      if (!prof.name){ homeErr = 'Ponete un nombre, crack 😅'; homeVals = { nm: '', cd: joinCode }; return; }
      saveProf();
      if (a === 'create') start(newCode(), true);
      else { const c = (joinCode || '').toUpperCase(); if (!/^[A-Z]{4}$/.test(c)){ homeErr = 'El código tiene 4 letras'; homeVals = { nm: prof.name, cd: joinCode }; return; } start(c, false); }
      break; }
    case 'rounds': if (Net.isHost && G && G.ph === 'lobby'){ G.rounds = +v; } break;
    case 'start': if (Net.isHost && G && G.ph === 'lobby') hostStart(); break;
    case 'again': if (Net.isHost && G){ G.ph = 'lobby'; G.res = null; HS = {}; G.sc = []; } break;
    case 'home': try { history.replaceState(null, '', location.pathname + location.search); } catch(e){} location.reload(); break;
    case 'tap': if (g && g.ph === 'play' && g.gk === 'tap'){ L.n++; setIn({ n: L.n }); SFX.tap(); } break;
    case 'react': if (g && g.ph === 'play' && g.gk === 'react'){
      const i = myIn(); if (i.ms != null || i.early) return;
      if (!g.d.go){ setIn({ early: 1 }); SFX.buzz(); vib(250); }
      else { setIn({ ms: Math.round(performance.now() - (L.go || performance.now())) }); SFX.ok(); }
    } break;
    case 'pass': if (g && g.ph === 'play' && g.gk === 'bomb' && g.d.h === me && !g.d.x){ L.pass++; setIn({ pass: L.pass }); } break;
    case 'stop': if (g && g.ph === 'play' && g.gk === 'stop'){ const i = myIn(); if (i.ms != null) return; setIn({ ms: Math.round(performance.now() - L.start) }); SFX.ok(); } break;
    case 'cnt': if (g && g.gk === 'count'){ L.guess = Math.max(0, Math.min(42, (L.guess || 0) + (+v))); SFX.tap(); } break;
    case 'cntok': if (g && g.ph === 'play' && g.gk === 'count' && !g.d.show){ const i = myIn(); if (i.g != null) return; setIn({ g: L.guess, at: Math.round(performance.now() - (L.as || performance.now())) }); SFX.ok(); } break;
    case 'col': if (g && g.ph === 'play' && g.gk === 'stroop'){
      const q = g.d.q, i = myIn(), ans = Object.assign({}, i.a || {});
      if (ans['q' + q]) return;
      const Q = stroopQs(g.d.seed)[q];
      ans['q' + q] = [+v, Math.round(performance.now() - (L.qs || performance.now()))];
      setIn({ a: ans }); (+v === Q.k ? SFX.ok : SFX.bad)();
    } break;
  }
}
app.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  e.preventDefault(); unlock(); act(el.dataset.a, el.dataset.v);
});
app.addEventListener('input', e => {
  if (e.target.id === 'nm') prof.name = e.target.value;
  if (e.target.id === 'cd'){ e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4); joinCode = e.target.value; }
});
app.addEventListener('keydown', e => { if (e.key === 'Enter'){ if (e.target.id === 'cd') act('join'); else if (e.target.id === 'nm') e.target.blur(); } });

const MED = ['🥇','🥈','🥉','🤡','💩','🥔','🪦','🫠'];

function renderIntro(g, P){

}
function timerPill(g){ return `<div class="timer">${Math.ceil(g.t / 1000)}s</div>`; }
function inOf(p, g){ const i = p.s.in; return (i && i.rid === g.rid) ? i : {}; }

function renderPlay(g, P){
  const me = ME(), d = g.d; let body = '';
  switch (g.gk){

      const ns = P.map(p => +inOf(p, g).n || 0), mx = Math.max(60, ...ns);

      else {

        else body = timerPill(g) + `<div class="sub">¿Cuántos 🐔 había?</div><div class="flex1"></div><div class="num">${L.guess}</div><div class="flex1"></div>
          <div class="steps"><button data-a="cnt" data-v="-5">-5</button><button data-a="cnt" data-v="-1">-1</button><button data-a="cnt" data-v="1">+1</button><button data-a="cnt" data-v="5">+5</button></div>

      break; }
    case 'stroop': {
      const Q = stroopQs(d.seed), q = Math.min(14, d.q || 0), cur = Q[q], ans = (myIn().a || {})['q' + q];
      body = `<div class="bar"><span class="pill">Pregunta ${q + 1}/15</span><span class="pill">${Math.ceil(g.t / 1000)}s</span></div>
        <div class="sword" data-q="${q}" style="color:${SC[cur.k].c}">${SC[cur.w].n}</div>
        <div class="sub">${ans ? (+ans[0] === cur.k ? '✅ ¡Bien!' : '❌ ¡Caíste!') : 'Tocá el color de la TINTA'}</div>
        <div class="sgrid">${cur.order.map(ci => `<button class="sbtn ${ans && +ans[0] === ci ? (ci === cur.k ? 'ok' : 'bad') : ''}" data-a="col" data-v="${ci}" style="color:${SC[(ci + cur.tint) % 4].c}">${SC[ci].n}</button>`).join('')}</div>`;
      break; }
  }
  return `<div class="screen">${bar(g, P)}${body}</div>`;
}
function pName(P, id){ const p = P.find(x => x.id === id); return p || { av: '👻', name: 'se fue', col: '#888' }; }
function renderRes(g, P){
  const gm = GAMES[g.gk] || {}, res = g.res || [];
  const last = res.length > 1 ? res[res.length - 1] : null, first = res[0];
  const roast = (last && last.pl > 0) ? `${esc(pName(P, last.id).name)}: ${ROASTS[g.rid % ROASTS.length]}` : '';
  return `<div class="screen">${bar(g, P)}
    <div class="rtitle">${gm.emoji || ''} ${esc(gm.name || '')}</div>
    ${g.rev ? `<div class="rev">${esc(g.rev)}</div>` : ''}
    <div class="rlist">${res.map((r, i) => { const p = pName(P, r.id); return `<div class="rrow" style="--c:${p.col};animation-delay:${i * .12}s"><span class="medal">${MED[r.pl] || '🫠'}</span><span class="av">${p.av}</span><span class="nm">${esc(p.name)}</span><span class="val">${esc(r.v)}</span><span class="pts">+${r.pts}</span></div>`; }).join('')}</div>
    ${first ? `<div class="win">${esc(pName(P, first.id).name)}: ${WINS[g.rid % WINS.length]}</div>` : ''}
    ${roast ? `<div class="roast">${roast}</div>` : ''}
    <div class="flex1"></div><div class="sub">${g.ri + 1 >= g.n ? 'Último resultado… 🥁' : 'Siguiente mini-juego en ' + Math.ceil(g.t / 1000) + '…'}</div></div>`;
}
function confetti(seed){ const r = rng(seed), C = ['#ffd60a','#ff2d87','#2fe0ff','#21d07a','#b25cff']; let s = '<div class="confetti">'; for (let i = 0; i < 45; i++) s += `<i style="left:${(r() * 100).toFixed(1)}%;background:${C[i % 5]};animation-duration:${(2.5 + r() * 3).toFixed(2)}s;animation-delay:${(r() * 3).toFixed(2)}s"></i>`; return s + '</div>'; }
function renderFinal(g, P){
  const sc = new Map(g.sc || []);
  const rows = P.map(p => ({ p, s: sc.get(p.id) || 0 })).sort((a, b) => b.s - a.s);
  const top = rows.slice(0, 3), ord = [top[1], top[0], top[2]], cls = ['p2', 'p1', 'p3'];
  const lastRow = rows.length > 1 ? rows[rows.length - 1] : null;
  return `${confetti(g.rid)}<div class="screen">
    <div class="rtitle" style="font-size:38px;margin-top:6px">🏆 FIN DEL BARDO</div>
    <div class="podium">${ord.map((x, i) => x ? `<div class="pod ${cls[i]}"><div class="av">${x.p.av}</div><div>${esc(x.p.name)}</div><div class="blk">${x.s}</div></div>` : '<div class="pod"></div>').join('')}</div>
    <div class="rlist">${rows.map((x, i) => `<div class="rrow" style="--c:${x.p.col};animation-delay:${i * .1}s"><span class="medal">${i + 1}°</span><span class="av">${x.p.av}</span><span class="nm">${esc(x.p.name)}<br><span class="title">${i === 0 ? '👑 LEYENDA DE LA NOCHE' : (lastRow && x === lastRow ? '🥔 LA PAPA DE LA NOCHE' : '')}</span></span><span class="pts">${x.s}</span></div>`).join('')}</div>
    <div class="flex1"></div>
    ${Net.isHost ? '<button class="big b1" data-a="again">🔁 ¡REVANCHA!</button>' : '<div class="sub pulse">Esperando la revancha…</div>'}
  </div>`;
}
function render(){
  if (screen === 'home') return renderHome();
  if (screen === 'connecting') return `<div class="screen center"><div class="gemoji">📡</div><div class="gname" style="font-size:32px">Conectando…</div></div>`;
  const g = curG(), P = players();
  if (!g) return renderWait();
  if (g.ph === 'lobby') return renderLobby(g, P);
  if (g.ph === 'intro') return renderIntro(g, P);
  if (g.ph === 'play') return renderPlay(g, P);
  if (g.ph === 'res') return renderRes(g, P);
  if (g.ph === 'final') return renderFinal(g, P);
  return renderWait();
}
let lastHTML = '';
function frame(){
  try { const h = render(); if (h !== lastHTML){ app.innerHTML = h; lastHTML = h; } } catch(e){ console.error(e); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
